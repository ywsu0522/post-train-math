[project]
name = "post-train-math"
version = "0.1.0"
description = "Frozen MATH boxed-numeric cohort with explicit LoRA RLOO and GR-REINFORCE."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "huggingface-hub>=0.34,<2",
    "numpy>=2,<3",
    "pandas==3.0.5",
    "pyarrow==25.0.1",
    "torch==2.13.0",
    "transformers==5.16.1",
    "peft==0.20.0",
    "datasets==4.8.5",
    "accelerate==1.15.0",
    "matplotlib>=3.10,<4",
]

[project.scripts]
post-train-math = "post_train_math.cli:main"

[build-system]
requires = ["uv_build>=0.12.6,<0.13"]
build-backend = "uv_build"

[tool.uv]
required-version = ">=0.12.6"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.build-backend]
module-name = "post_train_math"
namespace = true
source-include = ["cohort/**", "tests/**", "uv.lock"]
