[project]
name = "post-train-math"
version = "0.1.0"
description = "Pinned MATH cohort and candidate-model baseline evaluation."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "huggingface-hub>=0.34,<2",
    "numpy>=2,<3",
    "pandas>=3.0.5",
    "pyarrow>=25.0.1",
    "scikit-learn>=1.9.0",
    "tabulate>=0.10.0",
    "torch==2.13.0",
    "transformers>=5.5.3,<6",
]

[project.scripts]
post-train-math = "post_train_math.cli:main"

[build-system]
requires = ["uv_build>=0.12.6,<0.13"]
build-backend = "uv_build"

[tool.uv]
required-version = ">=0.12.6"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
